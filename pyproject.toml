[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeproj"
version = "0.1.0"
description = "Conway's Game of Life app built on fun-sim-core"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "imageio>=2.30",
  "PyYAML>=6.0",
  "fun-sim-core @ file:../fun-sim-core",
]

[tool.setuptools.packages.find]
include = ["lifex*"]
